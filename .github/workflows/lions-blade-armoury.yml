name: Patch Lion's Blade armoury

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lions-blade-armoury.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Lion's Blade weapon upgrades
        shell: python
        run: |
          import copy
          import json
          import re
          from pathlib import Path

          path = Path("Legiones Astartes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          cat = data["catalogue"]

          POINTS = "9893-c379-920b-8982"
          LB_CATALOGUE = "d16b-522f-e8b9-6d9b"
          SERGEANT = "8045-89a4-76d4-fcef"
          COMMAND = "9871-cb62-5283-2216"

          ENSIS = "lb-ensis-spei-global-0001"
          SPES = "lb-spes-aeterna-global-0001"
          VIGIL_PISTOL = "lb-vigil-pistol-global-0001"
          VIGIL_BOLTER = "lb-vigil-bolter-global-0001"
          VIGIL_HEAVY = "lb-vigil-heavy-bolter-global-0001"
          VIGIL_COMBI = "lb-vigil-combi-bolter-global-0001"

          BASES = {
              "2942-f783-d627-33c5": ("bolt pistol", "Vigil-pattern Bolt pistol", VIGIL_PISTOL),
              "d3f9-b9e6-3ea5-cc8e": ("bolter", "Vigil-pattern Bolter", VIGIL_BOLTER),
              "bc40-b14a-978e-0232": ("heavy bolter", "Vigil-pattern Heavy bolter", VIGIL_HEAVY),
              "042d-9e60-db9e-c147": ("combi-bolter", "Vigil-pattern Combi-bolter", VIGIL_COMBI),
          }

          def faction_condition():
              return {
                  "childId": LB_CATALOGUE,
                  "childName": "Lion's Blade",
                  "field": "selections",
                  "includeChildSelections": True,
                  "scope": "force",
                  "shared": True,
                  "type": "instanceOf",
                  "value": 1,
              }

          def subtype_condition(subtype, name):
              return {
                  "childId": subtype,
                  "childName": name,
                  "field": "selections",
                  "includeChildSelections": True,
                  "scope": "model",
                  "shared": True,
                  "type": "instanceOf",
                  "value": 1,
              }

          changed = False

          # Remove transient lbw-* links left by an earlier intermediate patch.
          def remove_transient_links(node):
              global changed
              if isinstance(node, list):
                  for item in node:
                      remove_transient_links(item)
                  return
              if not isinstance(node, dict):
                  return
              if isinstance(node.get("entryLinks"), list):
                  before = len(node["entryLinks"])
                  node["entryLinks"] = [
                      link for link in node["entryLinks"]
                      if not str(link.get("targetId", "")).startswith("lbw-")
                  ]
                  if len(node["entryLinks"]) != before:
                      changed = True
              for value in node.values():
                  if isinstance(value, (dict, list)):
                      remove_transient_links(value)

          remove_transient_links(cat)

          # Ensis Spei for Sergeant models and Spes Aeterna for Command models.
          legion_group = next(
              g for g in cat.get("sharedSelectionEntryGroups", [])
              if g.get("id") == "ef74-faa7-0d36-762b"
          )
          links = legion_group.setdefault("entryLinks", [])

          def add_legion_upgrade(name, entry_id, target_id, subtype, subtype_name):
              global changed
              if any(x.get("targetId") == target_id for x in links):
                  return
              links.append({
                  "name": name,
                  "id": entry_id,
                  "hidden": True,
                  "import": True,
                  "targetId": target_id,
                  "type": "selectionEntry",
                  "constraints": [{
                      "id": entry_id + "-max",
                      "field": "selections",
                      "scope": "parent",
                      "shared": True,
                      "type": "max",
                      "value": 1,
                  }],
                  "costs": [{
                      "name": "Point(s)",
                      "typeId": POINTS,
                      "value": 15,
                  }],
                  "modifiers": [{
                      "field": "hidden",
                      "type": "set",
                      "value": False,
                      "conditionGroups": [{
                          "type": "and",
                          "conditions": [
                              faction_condition(),
                              subtype_condition(subtype, subtype_name),
                          ],
                      }],
                  }],
              })
              changed = True

          add_legion_upgrade(
              "Ensis Spei", "lb-ensis-sergeant-upgrade",
              ENSIS, SERGEANT, "Sergeant Model Sub-Type"
          )
          add_legion_upgrade(
              "Spes Aeterna", "lb-spes-command-upgrade",
              SPES, COMMAND, "Command Model Sub-type"
          )

          stats = {
              "Vigil-pattern Bolt pistol": 0,
              "Vigil-pattern Bolter": 0,
              "Vigil-pattern Heavy bolter": 0,
              "Vigil-pattern Combi-bolter": 0,
          }

          def weapon_name(original, base_name, vigil_name):
              original = original or ""
              if re.search(re.escape(base_name), original, flags=re.IGNORECASE):
                  return re.sub(re.escape(base_name), vigil_name, original, flags=re.IGNORECASE)
              return vigil_name

          def base_cost(link):
              for c in link.get("costs", []):
                  if c.get("typeId") == POINTS:
                      return int(c.get("value", 0))
              return 0

          def is_choice_owner(node):
              if not isinstance(node, dict) or not isinstance(node.get("entryLinks"), list):
                  return False
              if node.get("type") == "selectionEntryGroup":
                  return True
              if node.get("type") is None and (
                  "constraints" in node or "defaultSelectionEntryId" in node
              ):
                  return True
              if node.get("name") in {
                  "Legion Heavy Weapons",
                  "Legion Pintle Weapons",
                  "Legion Combi-weapons",
              }:
                  return True
              return False

          def vigil_cost(kind, original_cost, names):
              if kind == "heavy bolter":
                  # Heavy Support takes the Vigil-pattern heavy bolter for 5 pts.
                  if "Legion Heavy Weapons" in names or "Heavy Support Squad" in names:
                      return 5
                  # Rhino heavy bolter is explicitly 15 pts.
                  if any(re.search(r"\bRhino\b", n or "", flags=re.IGNORECASE) for n in names):
                      return 15
              # Otherwise the Lion's Blade version costs +5 over the normal option.
              return original_cost + 5

          def required_count(link):
              values = [
                  int(float(c.get("value", 0)))
                  for c in link.get("constraints", [])
                  if c.get("type") == "min" and float(c.get("value", 0)) > 0
              ]
              return max(values) if values else 0

          def required_max(link, minimum):
              values = [
                  int(float(c.get("value", 0)))
                  for c in link.get("constraints", [])
                  if c.get("type") == "max" and float(c.get("value", 0)) > 0
              ]
              return max(values) if values else minimum

          def make_vigil_link(link, cfg, current_names):
              base_name, vigil_name, target_id = cfg

              copied_max = []
              for i, constraint in enumerate(link.get("constraints", [])):
                  if constraint.get("type") == "max":
                      new_constraint = copy.deepcopy(constraint)
                      new_constraint["id"] = f"lb-vigil-{link.get('id', 'x')}-max-{i}"
                      copied_max.append(new_constraint)

              if not copied_max:
                  copied_max = [{
                      "id": f"lb-vigil-{link.get('id', 'x')}-max",
                      "field": "selections",
                      "scope": "parent",
                      "shared": True,
                      "type": "max",
                      "value": max(1, required_count(link)),
                  }]

              cost_modifiers = [
                  copy.deepcopy(m)
                  for m in link.get("modifiers", [])
                  if m.get("field") == POINTS
              ]

              return {
                  "name": weapon_name(link.get("name"), base_name, vigil_name),
                  "id": f"lb-vigil-{link.get('id', 'x')}",
                  "hidden": True,
                  "import": True,
                  "targetId": target_id,
                  "type": "selectionEntry",
                  "constraints": copied_max,
                  "costs": [{
                      "name": "Point(s)",
                      "typeId": POINTS,
                      "value": vigil_cost(cfg[0], base_cost(link), current_names),
                  }],
                  "modifiers": cost_modifiers + [{
                      "field": "hidden",
                      "type": "set",
                      "value": False,
                      "conditions": [faction_condition()],
                  }],
              }

          def wrap_direct_weapon_links(node, current_names):
              """
              Turn every direct bolter-family link into a normal/Vigil replacement choice.
              This covers both mandatory wargear (for example Tactical Squad bolters and
              bolt pistols) and optional direct weapon links that are not stored in one of
              the shared weapon selection groups.
              """
              global changed

              entry_links = node.get("entryLinks")
              if not isinstance(entry_links, list) or is_choice_owner(node):
                  return

              candidates = []
              for link in list(entry_links):
                  cfg = BASES.get(link.get("targetId"))
                  if cfg:
                      candidates.append((link, cfg, required_count(link)))

              for link, cfg, minimum in candidates:
                  group_id = f"lb-vigil-direct-{link.get('id', 'x')}"
                  groups = node.setdefault("selectionEntryGroups", [])

                  if any(g.get("id") == group_id for g in groups):
                      continue

                  maximum = required_max(link, minimum)
                  if maximum <= 0:
                      maximum = 1

                  normal_link = copy.deepcopy(link)
                  # The group owns the selection limits; the nested normal option keeps
                  # all other link behaviour/modifiers but not its own min/max limits.
                  normal_link["constraints"] = [
                      copy.deepcopy(c)
                      for c in link.get("constraints", [])
                      if c.get("type") not in {"min", "max"}
                  ]

                  vigil_link = make_vigil_link(link, cfg, current_names)
                  vigil_link["constraints"] = [
                      copy.deepcopy(c)
                      for c in vigil_link.get("constraints", [])
                      if c.get("type") not in {"min", "max"}
                  ]

                  group_constraints = [{
                      "id": group_id + "-max",
                      "field": "selections",
                      "scope": "parent",
                      "shared": True,
                      "type": "max",
                      "value": maximum,
                  }]
                  if minimum > 0:
                      group_constraints.insert(0, {
                          "id": group_id + "-min",
                          "field": "selections",
                          "scope": "parent",
                          "shared": True,
                          "type": "min",
                          "value": minimum,
                      })

                  group = {
                      "name": f"{link.get('name', cfg[0])} / {cfg[1]}",
                      "id": group_id,
                      "hidden": False,
                      "type": "selectionEntryGroup",
                      "constraints": group_constraints,
                      "entryLinks": [normal_link, vigil_link],
                  }
                  if minimum > 0:
                      group["defaultSelectionEntryId"] = normal_link.get("id")

                  entry_links.remove(link)
                  groups.append(group)
                  stats[cfg[1]] += 1
                  changed = True

          def patch(node, names=None):
              global changed
              if names is None:
                  names = []
              if isinstance(node, list):
                  for item in node:
                      patch(item, names)
                  return
              if not isinstance(node, dict):
                  return

              current_names = names + ([node.get("name")] if node.get("name") else [])

              wrap_direct_weapon_links(node, current_names)

              entry_links = node.get("entryLinks")
              if is_choice_owner(node):
                  originals = list(entry_links)
                  for link in originals:
                      cfg = BASES.get(link.get("targetId"))
                      if not cfg:
                          continue

                      base_name, vigil_name, target_id = cfg
                      existing = next(
                          (x for x in entry_links if x.get("targetId") == target_id),
                          None
                      )
                      if existing:
                          desired = vigil_cost(cfg[0], base_cost(link), current_names)
                          point_cost = next(
                              (x for x in existing.get("costs", []) if x.get("typeId") == POINTS),
                              None
                          )
                          if point_cost is None:
                              existing.setdefault("costs", []).append({
                                  "name": "Point(s)",
                                  "typeId": POINTS,
                                  "value": desired,
                              })
                              changed = True
                          elif point_cost.get("value") != desired:
                              point_cost["value"] = desired
                              changed = True
                          continue

                      new_link = make_vigil_link(link, cfg, current_names)

                      # Put the Lion's Blade analogue immediately after the normal weapon.
                      idx = entry_links.index(link)
                      entry_links.insert(idx + 1, new_link)
                      stats[vigil_name] += 1
                      changed = True

              # Recurse into nested imported groups too.
              for key, value in list(node.items()):
                  if isinstance(value, (dict, list)):
                      patch(value, current_names)

          patch(cat)

          if not changed:
              print("No changes required.")
              raise SystemExit(0)

          cat["revision"] = int(cat.get("revision", 0)) + 1
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Added Lion's Blade armoury options:")
          for name, count in stats.items():
              print(f" - {name}: {count} selectable locations")
          print(" - Ensis Spei: Sergeant models, +15 pts")
          print(" - Spes Aeterna: Command models, +15 pts")
          print(" - Every direct bolter-family link (mandatory or optional) is converted into a normal/Vigil replacement choice")
          print(" - Bolter / bolt pistol / combi-bolter: normal option +5 pts")
          print(" - Vigil-pattern Heavy bolter: Heavy Support 5 pts; Rhino 15 pts; otherwise normal option +5 pts")

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.json"
          git commit -m "Add Lion's Blade armoury upgrades"
          git push
