name: Enable Lion's Blade detachments

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/enable-lions-blade-detachments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standard Astartes detachment visibility
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("Horus Heresy 3rd Edition.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          gs = data["gameSystem"]

          LB = "d16b-522f-e8b9-6d9b"
          UM = "656a-07b6-d4fd-57af"
          DA = "0a35-fce3-188c-b3aa"

          def has_id(x, target):
              if isinstance(x, list):
                  return any(has_id(v, target) for v in x)
              if isinstance(x, dict):
                  if x.get("childId") == target:
                      return True
                  return any(has_id(v, target) for v in x.values())
              return False

          def clone_replace(obj, from_id, to_id):
              import copy
              c = copy.deepcopy(obj)
              def rec(x):
                  if isinstance(x, list):
                      for v in x:
                          rec(v)
                  elif isinstance(x, dict):
                      if x.get("childId") == from_id:
                          x["childId"] = to_id
                      if isinstance(x.get("comment"), str) and ("UM" in x["comment"] or "Ultramarines" in x["comment"]):
                          x["comment"] = "Lion's Blade"
                      for v in x.values():
                          rec(v)
              rec(c)
              c.setdefault("comment", "Lion's Blade")
              return c

          changed = []

          def patch_generic_faction_enumerations(x, context=""):
              if isinstance(x, list):
                  for v in x:
                      patch_generic_faction_enumerations(v, context)
                  return
              if not isinstance(x, dict):
                  return

              # Many game-system rules enumerate all supported factions inside a large OR group.
              # Mirror the Ultramarines branch as the default Legiones Astartes baseline for Lion's Blade.
              if x.get("type") == "or":
                  for key in ("conditionGroups", "conditions"):
                      items = x.get(key)
                      if not isinstance(items, list):
                          continue

                      has_um = any(has_id(v, UM) for v in items)
                      has_da = any(has_id(v, DA) for v in items)
                      has_lb = any(has_id(v, LB) for v in items)

                      if len(items) >= 10 and has_um and has_da and not has_lb:
                          um_item = next(v for v in items if has_id(v, UM))
                          items.append(clone_replace(um_item, UM, LB))
                          changed.append(context or "generic faction rule")

              for k, v in x.items():
                  next_context = context
                  if isinstance(x.get("name"), str):
                      next_context = x["name"]
                  patch_generic_faction_enumerations(v, next_context)

          patch_generic_faction_enumerations(gs, "Horus Heresy 3rd Edition")

          if not changed:
              print("No changes required.")
              raise SystemExit(0)

          gs["revision"] = int(gs.get("revision", 0)) + 1
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Enabled for:")
          for name in sorted(set(changed)):
              print(" -", name)

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Horus Heresy 3rd Edition.json"
          git commit -m "Enable standard Astartes detachments for Lion's Blade"
          git push

# trigger standard detachment patch
