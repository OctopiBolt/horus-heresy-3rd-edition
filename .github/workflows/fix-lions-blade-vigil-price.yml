name: Fix Lion's Blade Vigil Heavy Bolter Price

on:
  push:
    paths:
      - 'scripts/fix_lions_blade_vigil_price.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch catalogue
        run: python scripts/fix_lions_blade_vigil_price.py

      - name: Commit change
        run: |
          if git diff --quiet -- "Legiones Astartes.json"; then
            echo "No catalogue change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.json"
          git commit -m "Fix Lion's Blade Vigil heavy bolter upgrade price"
          git push
